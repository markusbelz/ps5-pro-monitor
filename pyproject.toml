[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-monitor"
version = "0.1.0"
description = "PS5 Pro availability monitor for Germany (notify only, never buys)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6,<7",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ps5-monitor = "ps5_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
