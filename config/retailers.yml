# Retailer pages checked on 2026-10-30 from GitHub-hosted runners:
#   mediamarkt / saturn -> HTTP 403 (automated access refused; never worked around)
#   playstation_direct  -> redirected to a retailer overview page; covered by the watchers below
#   expert              -> no product data in the page (client-side rendered)
# They stay disabled so the monitor does not hit them every run for nothing.
retailers:
  playstation_direct: {enabled: false, url: "https://direct.playstation.com/de-de/buy-consoles/playstation5-pro-console-2-tb"}
  mediamarkt: {enabled: false, url: "https://www.mediamarkt.de/de/product/_sony-playstationr5-pro-2-tb-konsole-3018022.html"}
  saturn: {enabled: false, url: "https://www.saturn.de/de/product/_sony-playstationr5-pro-2-tb-konsole-3018022.html"}
  expert: {enabled: false, url: "https://www.expert.de/shop/unsere-produkte/gaming-freizeit/sony-playstation/playstation-konsolen/11364201744-playstation-5-pro.html"}
  amazon: {enabled: false, url: ""}

# Official Sony pages. While the PS5 Pro 2 TB is not purchasable they show a notice like
# "Derzeit nicht vorrätig". When it is gone you get an early (unverified) Telegram heads-up.
watchers:
  - name: "PlayStation Direct DE - PS5 Pro 2 TB"
    url: "https://direct.playstation.com/de-de/buy-consoles/playstation5-pro-console-2-tb"
    allowed_hosts: ["direct.playstation.com", "playstation.com"]
    unavailable_phrases:
      - "derzeit nicht vorrätig"
      - "zurzeit nicht verfügbar"
      - "sie können diese artikel derzeit nicht kaufen"
  - name: "PlayStation.com DE - PS5 Pro Kaufseite"
    url: "https://www.playstation.com/de-de/ps5/ps5-pro/buy-now/"
    allowed_hosts: ["playstation.com", "direct.playstation.com"]
    unavailable_phrases:
      - "nicht zum kauf erhältlich"
      - "derzeit nicht vorrätig"

  # --- Netherlands (family): PlayStation Direct NL ships to Dutch addresses only and needs a sign-in.
  # The 2 TB page redirects to the NL buy-now page while unavailable (same pattern as Germany).
  # Dutch notice texts below are only partly verified: check the dry-run output ("hints=") and adjust.
  - name: "PlayStation Direct NL - PS5 Pro (overzicht)"
    url: "https://direct.playstation.com/nl-nl/buy-consoles/playstation5-pro-console"
    allowed_hosts: ["direct.playstation.com", "playstation.com"]
    alert_on_first_check: false
    unavailable_phrases:
      - "momenteel niet beschikbaar"
      - "komt binnenkort"
  - name: "PlayStation Direct NL - PS5 Pro 2 TB"
    url: "https://direct.playstation.com/nl-nl/buy-consoles/playstation5-pro-console-2-tb"
    allowed_hosts: ["direct.playstation.com", "playstation.com"]
    alert_on_first_check: false
    unavailable_phrases:
      - "momenteel niet beschikbaar"
      - "niet beschikbaar voor aankoop"
      - "momenteel niet op voorraad"
      - "niet op voorraad"
      - "komt binnenkort"
  - name: "PlayStation.com NL - PS5 Pro Kaufseite"
    url: "https://www.playstation.com/nl-nl/ps5/ps5-pro/buy-now/"
    allowed_hosts: ["playstation.com", "direct.playstation.com"]
    alert_on_first_check: false
    unavailable_phrases:
      - "momenteel niet beschikbaar"
      - "niet beschikbaar voor aankoop"
      - "momenteel niet op voorraad"
      - "niet op voorraad"
      - "komt binnenkort"
